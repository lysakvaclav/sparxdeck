# The platform's checks on every push and pull request that touches it.
# - checks: lint, types, unit tests and a production build (no secrets needed;
#   the database tests skip themselves without Supabase keys).
# - main-flow: the Playwright test of the whole flow against the development
#   Supabase project. Runs when the repository variable RUN_MAIN_FLOW is "true"
#   and the secrets below are set (Settings → Secrets and variables → Actions).
name: Platform

on:
  push:
    paths: ["apps/platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["apps/platform/**", ".github/workflows/platform.yml"]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/platform

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public placeholders: the build reads them, nothing connects at build time.
      NEXT_PUBLIC_APP_URL: https://portal.sparxdeck.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      # --prefix .: the platform's own lockfile, not the repository root workspace.
      - run: npm ci --prefix . --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check src tests e2e playwright
      - run: npm test
      - run: npm run build

  main-flow:
    if: ${{ vars.RUN_MAIN_FLOW == 'true' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci --prefix . --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:flow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/platform/.e2e-output/playwright
          retention-days: 7
