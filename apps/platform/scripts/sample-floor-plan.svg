    <path d="M560 430V350A80 80 0 0 1 640 430"/>
    <path d="M1140 430V350A80 80 0 0 1 1220 430"/>
    <path d="M300 570V650A80 80 0 0 0 380 570"/>
    <path d="M760 570V650A80 80 0 0 0 840 570"/>
