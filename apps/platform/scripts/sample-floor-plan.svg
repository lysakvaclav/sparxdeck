<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 1600 1000">
  <!-- Sample floor plan of an apartment house floor (no text: works in any language).
       Rendered to src/assets/sample/floor-plan.webp by scripts/generate-sample-plan.mjs. -->
  <rect width="1600" height="1000" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#eef2f5" stroke-width="1">
