    <path d="M80 760H230M300 760H560M1000 740H1140M1210 740H1520" stroke-width="6"/>
    <path d="M300 570V660M300 720V760" stroke-width="6"/>
    <path d="M1300 740V830M1300 880V920" stroke-width="6"/>
